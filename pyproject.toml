[project]
name = "rllib-training-guildelines"
version = "0.1.0"
description = "RLlib Training Guidelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "debugpy>=1.8.16",
    "gymnasium>=1.1.1",
    "neptune>=1.14.0",
    "ray[default,rllib]==2.49.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[tool.mypy]
ignore_missing_imports = true
