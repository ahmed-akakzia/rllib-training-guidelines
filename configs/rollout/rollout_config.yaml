# Rollout configuration for RLlib Training
# This file contains the rollout configuration
defaults: 
  - _self_

_target_: config_factory.config_basemodels.rollout_config_basemodel.RolloutConfigBaseModel
rollout_unit: episodes # Can either be episodes, steps or time (in seconds)
rollout_unit_value: 1 # Number of rollout units to perform. 
logging_level: INFO # Logging level, to choose from INFO, DEBUG, WARNING, ERROR, CRITICAL

hydra:
  output_subdir: null
  run:
    dir: .